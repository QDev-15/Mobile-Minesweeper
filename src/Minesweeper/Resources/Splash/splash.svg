            <stop offset="0" stop-color="#3E5BC7" />
            <stop offset="1" stop-color="#121B38" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" rx="104" fill="url(#bg)" />

    <ellipse cx="228" cy="366" rx="104" ry="14" fill="#0A1230" opacity="0.2" />

