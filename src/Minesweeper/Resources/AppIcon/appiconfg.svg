<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Adaptive icon FOREGROUND layer. Remixed from the classic Minesweeper status-row motifs (smiley,
         flag, mine, numbered cell) — not a copy of any specific app's artwork, redrawn as a 2x2 grid in
         this app's own cream/navy/accent palette instead of a gray 3D-bevel frame. Flat shapes, at most one
         thin stroke each; no gradients/bevels (they turn to mud at the ~48dp size this icon is actually
         seen at). Everything essential sits inside x/y 90-366, the ~60-66% launcher-mask safe zone. -->

    <ellipse cx="228" cy="366" rx="104" ry="14" fill="#0A1230" opacity="0.2" />

    <!-- Top-left: smiley — the single most recognizable Minesweeper mark, kept as the visual anchor. -->
    <rect x="103" y="103" width="120" height="120" rx="26" fill="#FBF8F2" />
    <circle cx="163" cy="163" r="44" fill="#FFD24D" />
    <circle cx="148" cy="150" r="6" fill="#2A3560" />
    <circle cx="178" cy="150" r="6" fill="#2A3560" />
    <path d="M145,172 Q163,188 181,172" stroke="#2A3560" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Top-right: flag. -->
    <rect x="233" y="103" width="120" height="120" rx="26" fill="#FBF8F2" />
    <rect x="286" y="128" width="12" height="64" rx="6" fill="#2A3560" />
    <path d="M298,132 L326,150 L298,168 Z" fill="#F2A93C" />

    <!-- Bottom-left: mine. -->
    <rect x="103" y="233" width="120" height="120" rx="26" fill="#FBF8F2" />
    <circle cx="163" cy="293" r="34" fill="#1B2347" />
    <g stroke="#1B2347" stroke-width="8" stroke-linecap="round">
        <line x1="163" y1="251" x2="163" y2="241" />
        <line x1="163" y1="335" x2="163" y2="345" />
        <line x1="121" y1="293" x2="111" y2="293" />
        <line x1="205" y1="293" x2="215" y2="293" />
    </g>

    <!-- Bottom-right: the number "3" — same red as this app's own real in-game Number3 token, so the
         icon's palette matches what the board itself actually looks like. -->
    <rect x="233" y="233" width="120" height="120" rx="26" fill="#FBF8F2" />
    <text x="293" y="296" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="70"
          fill="#D64545" text-anchor="middle">3</text>
</svg>
