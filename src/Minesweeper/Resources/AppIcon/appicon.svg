<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Adaptive icon BACKGROUND layer (full-bleed, never shown alone). Deliberately quiet: a single
         two-stop diagonal gradient in the app's own Primary-blue family, no radial glow/extra layers.
         Research on current icon practice (see design notes) converges on "one focal shape, one confident
         field" — so the background's only job here is to be a calm, high-contrast field that makes the
         foreground's orange flag pop, not a second competing element. -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3E5BC7" />
            <stop offset="1" stop-color="#121B38" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#bg)" />
</svg>
